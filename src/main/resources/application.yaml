spring:
  application:
    name: iga-scanner
  datasource:
    url: jdbc:sqlserver://dbtestgt.database.windows.net;databaseName=free-sql-db-9472607;encrypt=false;trustServerCertificate=false;DB_CLOSE_DELAY=-1
    username: adrian
    password: ${SQLSERVER_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  ai:
    vectorstore:
      qdrant:
        host: a1c74484-2d4f-4eb5-8877-583182740d64.sa-east-1-0.aws.cloud.qdrant.io
        port: 6334
        use-tls: true
        api-key: ${QDRANT_API_KEY}
        collection-name: historicos
        initialize-schema: true
    azure:
      openai:
        # Auth via Entra ID (see AzureOpenAiTokenCredentialConfig) — no api-key needed.
        endpoint: https://azfnd01.openai.azure.com
        embedding:
          options:
            deployment-name: text-embedding-3-small

iga:
  scanner:
    ai:
      # Which Azure AI Foundry model adapter to activate; swapping providers never touches
      # the application/domain layers, only this property (see ChatGenerationPort adapters).
      provider: anthropic # anthropic | azure-openai
      # Auth is always Microsoft Entra ID via the local `az login` session (no API keys).
      # anthropic base-url shape: https://<resource-name>.services.ai.azure.com/anthropic
      # azure-openai base-url shape: https://<resource-name>.openai.azure.com
      base-url: https://azfnd01.services.ai.azure.com/api/projects/proj-jira
      deployment-name: claude-haiku-4-5
      max-tokens: 4096
      temperature: 0.0
    rag:
      # Guardrail: chunks scoring below this are treated as not-grounded, never passed to the model.
      similarity-threshold: 0.5
    pdf:
      # Staging folder for the original PDF and its converted Markdown, for tracking only.
      process-dir: /home/adrian/Escritorio/process
