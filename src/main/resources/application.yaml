spring:
  application:
    name: iga-scanner
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=iga_scanner;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  ai:
    vectorstore:
      qdrant:
        host: ${QDRANT_HOST:localhost}
        port: ${QDRANT_PORT:6334}
        use-tls: ${QDRANT_USE_TLS:false}
        api-key: ${QDRANT_API_KEY:}
        collection-name: ${QDRANT_COLLECTION:environmental-commitments}
        initialize-schema: true

iga:
  scanner:
    ai:
      # Which Azure AI Foundry model adapter to activate; swapping providers never touches
      # the application/domain layers, only this property (see ChatGenerationPort adapters).
      provider: ${AI_PROVIDER:anthropic} # anthropic | azure-openai
      # Auth is always Microsoft Entra ID via the local `az login` session (no API keys).
      # anthropic base-url shape: https://<resource-name>.services.ai.azure.com/anthropic
      # azure-openai base-url shape: https://<resource-name>.openai.azure.com
      base-url: ${AZURE_AI_BASE_URL}
      deployment-name: ${AZURE_AI_DEPLOYMENT:claude-haiku-4-5}
      max-tokens: 4096
      temperature: 0.0
    rag:
      # Guardrail: chunks scoring below this are treated as not-grounded, never passed to the model.
      similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.5}
    pdf:
      # Staging folder for the original PDF and its converted Markdown, for tracking only.
      process-dir: ${PDF_PROCESS_DIR:./process}
